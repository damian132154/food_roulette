<title>뭐 먹지</title>

<style>
:root{--bg:#fdf9f6;--card:#fff;--ink:#151922;--ink2:#5b6472;--ink3:#98a0ac;

*{box-sizing:border-box}
body{margin:0;color:var(--ink);

.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
header{text-align:center;margin-bottom:18px}
h1{margin:0 0 5px;font-size:30px;font-weight:800;letter-spacing:-.03em}
h1 b{color:var(--warm)}
.lead{margin:0;color:var(--ink2);font-size:13px}
#clock{color:var(--ink3);font-size:12.5px;margin-top:5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:900px){
 .cols{grid-template-columns:1fr;display:flex;flex-direction:column}
 .colR{display:contents}          /* 룰렛 · 필터를 각각 독립 항목으로 */
 .colL{display:contents}
 .stage{order:1}                  /* 룰렛 맨 위 */
 .filters{order:2}                /* 끼니 · 종류 · 조건 */
 .mapcard{order:3}                /* 주변 맛집 지도 */
 .histcard{order:4}               /* 최근 먹은 것 */
 .wheelbox{width:220px;height:220px}
 #slot{font-size:23px}
 .emo{font-size:42px}
 #lmap{height:280px}
}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;

.ch{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.ct{font-size:14px;font-weight:800}
.cs{font-size:11.5px;color:var(--ink3);margin-left:auto}
#lmap{width:100%;height:330px;border-radius:12px;border:1px solid var(--line);

.stage{background:#fff;border:1px solid var(--line);border-radius:18px;
 padding:20px 18px;text-align:center;box-shadow:0 4px 20px rgba(194,65,12,.07)}
.wheelbox{position:relative;width:250px;height:250px;margin:0 auto 8px}
#wheel{width:100%;height:100%;border-radius:50%;position:relative;
 transition:transform 4s cubic-bezier(.17,.67,.24,1);border:5px solid #fff;
 box-shadow:0 6px 24px rgba(194,65,12,.18)}
.sl{position:absolute;inset:0;clip-path:polygon(50% 50%,50% 0,100% 0);
 transform-origin:50% 50%;display:flex;align-items:flex-start;
 justify-content:center;padding-top:15px}
.sl span{font-size:19px;transform:rotate(22deg)}
.pin{position:absolute;top:-12px;left:50%;transform:translateX(-50%);
 font-size:24px;z-index:5}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 width:54px;height:54px;border-radius:50%;background:#fff;z-index:4;
 display:flex;align-items:center;justify-content:center;font-size:11.5px;
 font-weight:800;color:var(--warm);box-shadow:0 2px 8px rgba(0,0,0,.12)}
#slot{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.25;
 min-height:46px}
.emo{display:block;font-size:48px;line-height:1.1}
#meta{font-size:12.5px;color:var(--ink2);margin-top:7px;min-height:18px}

.btn{padding:12px 26px;border:none;border-radius:12px;background:var(--warm);

.btn.g{background:#fff;color:var(--ink2);border:1px solid var(--line);

.seg{display:flex;gap:6px;flex-wrap:wrap}
.sg{border:1px solid var(--line);background:#fff;color:var(--ink2);

 font-family:inherit;font-weight:700}
.sg:hover{border-color:var(--warm);color:var(--warm)}

<header><h1>뭐 <b>먹지</b></h1>
<p class="lead">고민하는 시간이 제일 아깝다. 뽑으면 주변 맛집까지 찾아준다.</p>
<div id="clock"></div></header>

<div class="cols">
 <div class="colL">
  <div class="card mapcard">
    <div class="ch"><div class="ct">주변 맛집 지도</div>
      <span class="cs" id="nearinfo">위치를 켜면 뜬다</span></div>
    <div id="lmap"></div>
    <div class="addrow" style="margin-top:10px">
      <select id="rad">
        <option value="300">300 m</option>
        <option value="600" selected>600 m</option>
        <option value="1000">1 km</option>
        <option value="2000">2 km</option></select>
      <button id="nearBtn">주변 다시 찾기</button>
      <button id="mapK" style="background:#fff;color:#5b6472;
        border:1px solid #eee3da">카카오맵 ↗</button>
    </div>
    <div id="near" style="margin-top:10px"></div>
  </div>
  <div class="card histcard">
    <div class="ch"><div class="ct">최근 먹은 것</div>
      <span class="cs" id="histinfo"></span></div>
    <div id="hist"></div>
    <div class="addrow">
      <input type="text" id="cn" placeholder="목록에 없는 것 추가">
      <input type="number" id="ck" placeholder="kcal" style="max-width:80px">
      <button id="cadd">추가</button>
    </div>
  </div>
 </div>

 <div class="colR">
  <div class="stage">
    <div class="wheelbox"><div class="pin">▼</div>
      <div id="wheel"></div><div class="hub">뭐먹지</div></div>
    <div id="slot">?</div>
    <div id="meta">조건을 고르고 뽑으면 된다</div>
    <div class="btns">
      <button class="btn" id="roll">뽑기</button>
      <button class="btn g" id="again">다시</button>
      <button class="btn g" id="eat">이걸로 먹음</button>
    </div>
  </div>
  <div class="card filters" style="margin-top:13px">
    <div class="lb">언제 <span class="cs" id="autoslot"></span></div>
    <div class="seg" id="segMeal"></div>
    <div class="lb">종류</div>
    <div class="seg" id="segCat"></div>
    <div class="lb">최근 먹은 것 빼기</div>
    <div class="seg" id="segSkip"></div>
    <div class="lb">조건 <span class="cs">겹쳐 누를 수 있다</span></div>
    <div class="seg" id="segOpt"></div>
    <div class="pool" id="pool"></div>
    <div class="cands" id="cands"></div>
  </div>
 </div>
</div>
<footer>지도는 OpenStreetMap · 가게 정보는 카카오맵에서 본다</footer>
</div>

// localStorage 가 막힌 환경에서도 죽지 않게
const LSget=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const LSset=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
let HIST=[],CUSTOM=[];
try{HIST=JSON.parse(LSget(LSH)||'[]');}catch(e){}
try{CUSTOM=JSON.parse(LSget(LSC)||'[]');}catch(e){}
// 식단 · 칼로리 페이지에 적은 것도 같이 본다
function dietEaten(){
  let D={};
  try{D=JSON.parse(LSget('diet_log')||'{}');}catch(e){return [];}
  const out=[];
  Object.keys(D).sort().reverse().forEach(k=>{
    (D[k].items||[]).slice().reverse().forEach(x=>{
      out.push({n:x.n,k:Math.round(x.k*(x.q||1)),m:x.m||'',e:'🍽',
                d:k.slice(5),t:'',src:'식단'});
    });
  });
  return out;
}
function merged(){
  const a=HIST.map(h=>Object.assign({src:'룰렛'},h));
  return a.concat(dietEaten()).sort((x,y)=>
    (y.d+(y.t||'')).localeCompare(x.d+(x.t||'')));
}

function el(i){return document.getElementById(i);}
function autoMeal(){const h=new Date().getHours();
  return h<10?'아침':h<15?'점심':h<21?'저녁':'야식';}
selMeal=autoMeal();

function seg(box,list,set,cls){
  list.forEach(n=>{
    const b=document.createElement('button');
    b.className='sg'+(cls?' '+cls:'');b.textContent=n;
    b.onclick=()=>{
      if(set==='meal'){selMeal=(selMeal===n?'':n);
        box.querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));
        if(selMeal===n)b.classList.add('on');
      }else{if(set.has(n))set.delete(n);else set.add(n);
        b.classList.toggle('on',set.has(n));}
      pool();
    };
    if(set==='meal'&&n===selMeal)b.classList.add('on');
    box.appendChild(b);
  });
}

  b.className='sg'+(SKIP===v?' on':'');b.textContent=n;
  b.onclick=()=>{SKIP=v;LSset('eat_skip',v);
    el('segSkip').querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));

function all(){return DB.concat(CUSTOM.map(c=>[c.n,c.k,'','직접','','🍽']));}
function pick(){
  const recent=SKIP?merged().slice(0,SKIP).map(h=>h.n):[];
  let list=all().filter(f=>{
    if(selMeal&&f[2]&&!f[2].split(',').includes(selMeal))return false;
    if(selCat.size&&!selCat.has(f[3]))return false;
    if(selOpt.size){const tg=(f[4]||'').split(',');
      for(const o of selOpt)if(!tg.includes(o))return false;}
    return true;
  });
  if(!list.length)return null;
  const fresh=list.filter(f=>!recent.includes(f[0]));
  return fresh.length?fresh:list;
}
function pool(){
  const l=pick();
  el('pool').textContent=l?('후보 '+l.length+' 개'+
    (SKIP?'　·　최근 '+Math.min(SKIP,merged().length)+' 끼 제외':'')):
    '조건에 맞는 게 없다. 조건을 풀어라.';
  el('cands').innerHTML=l?l.slice(0,16).map(f=>
    '<span class="cd">'+(f[5]||'')+' '+f[0]+'</span>').join(''):'';
  drawWheel(l||[]);
}
const COL=['#fde8d8','#fff3e6','#ffe4d1','#fff7f0','#fdead9','#fff1e4',
 '#ffe9da','#fff5ec'];
let ANG=0,FACE=[];
function drawWheel(list){
  const w=el('wheel');
  FACE=list.slice().sort(()=>Math.random()-0.5).slice(0,8);
  const n=Math.max(1,FACE.length);
  const deg=360/n;
  w.style.background='conic-gradient('+Array.from({length:n},(_,i)=>
    COL[i%COL.length]+' '+(i*deg)+'deg '+((i+1)*deg)+'deg').join(',')+')';
  w.innerHTML=Array.from({length:n},(_,i)=>
    '<div class="sl" style="transform:rotate('+(i*deg)+'deg)"><span>'+
    ((FACE[i]&&FACE[i][5])||'🍽')+'</span></div>').join('');
}
function roll(){
  if(!FACE.length){el('slot').innerHTML='—';return;}
  const n=FACE.length,deg=360/n;
  const idx=Math.floor(Math.random()*n);
  const f=FACE[idx];
  ANG+=360*6-((ANG%360)+idx*deg+deg/2);
  el('wheel').style.transform='rotate('+ANG+'deg)';
  el('slot').innerHTML='<span class="emo">🎲</span>';
  el('meta').textContent='';
  setTimeout(()=>{
    last=f;
    el('slot').innerHTML='<span class="emo">'+(f[5]||'')+'</span>'+f[0];
    el('meta').innerHTML='<span class="kc">'+f[1]+' kcal</span>'+
      (f[3]?'　·　'+f[3]:'')+(f[4]?'　·　'+f[4].split(',').join(' · '):'');
    nearby();
  },4100);
}
el('roll').onclick=roll;
el('again').onclick=roll;
el('eat').onclick=()=>{
  if(!last)return;
  const d=new Date();
  HIST.unshift({n:last[0],k:last[1],m:selMeal||autoMeal(),e:last[5]||'',
    d:d.toISOString().slice(5,10),
    t:String(d.getHours()).padStart(2,'0')+':'+
      String(d.getMinutes()).padStart(2,'0')});
  HIST=HIST.slice(0,100);
  LSset(LSH,JSON.stringify(HIST));
  hist();pool();
  const b=el('eat');b.textContent='기록했다';
  setTimeout(()=>b.textContent='이걸로 먹음',1200);
};
function hist(){
  const all=merged();
  const nd=all.length-HIST.length;
  el('histinfo').textContent=all.length+' 개'+(nd?'　(식단 '+nd+')':'');

    '<div class="hr"><span class="hd">'+h.d+' '+(h.t||'')+'</span>'+
    '<span class="hn">'+(h.e||'')+' '+h.n+'</span>'+
    (h.src==='식단'?'<span class="nc">식단</span>':'')+
    '<span>'+h.k+'</span>'+
    (h.src==='룰렛'?'<button class="hx" data-n="'+
      encodeURIComponent(h.n)+'">✕</button>':'')+'</div>'
  ).join('')||'<div class="tip">아직 없다. 뽑고 「이걸로 먹음」 을 누르거나 '+
    '식단 페이지에 적으면 여기 쌓인다.</div>';
  el('hist').querySelectorAll('.hx').forEach(b=>b.onclick=()=>{
    const n=decodeURIComponent(b.dataset.n);
    const i=HIST.findIndex(h=>h.n===n);
    if(i>=0)HIST.splice(i,1);
    LSset(LSH,JSON.stringify(HIST));hist();pool();});
}
el('cadd').onclick=()=>{
  const n=el('cn').value.trim(),k=+el('ck').value||0;
  if(!n)return;
  CUSTOM.push({n:n,k:k});
  LSset(LSC,JSON.stringify(CUSTOM));
  el('cn').value='';el('ck').value='';pool();
};
// ── 지도 ──────────────────────────────────────
const KKEY='943c6dbf693c303fc47b5d1856d46da5';
const USEK=false;   // 카카오 도메인 승인 문제 — 해결되면 true 로
let KMAP=null,KMARK=[],KREADY=false;
let KTRIED=false, KFAIL=false;
function loadKakao(){
  if(KTRIED)return;
  KTRIED=true;
  const s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KKEY+
        '&libraries=services&autoload=false';
  s.onerror=()=>{
    KFAIL=true;
    el('nearinfo').innerHTML='<b style="color:#c2410c">카카오 지도를 못 불러왔다</b>'+
      ' — 광고 차단 확장 프로그램이 막았을 수 있다 (시크릿 창에서 확인)';
    initMap();nearby();};
  s.onload=()=>kakao.maps.load(()=>{
    KREADY=true;
    KMAP=new kakao.maps.Map(el('lmap'),{
      center:new kakao.maps.LatLng(LOC?LOC.latitude:37.2939,
                                   LOC?LOC.longitude:126.9769),level:4});
    const rl=()=>{try{KMAP.relayout();}catch(e){}};
    setTimeout(rl,150);setTimeout(rl,600);setTimeout(rl,1500);
    window.addEventListener('resize',rl);
    if(window.ResizeObserver)new ResizeObserver(rl).observe(el('lmap'));
    el('nearinfo').textContent='카카오맵 준비됨';
    try{KMAP.relayout();}catch(e){}
    if(LOC){KMAP.setCenter(new kakao.maps.LatLng(LOC.latitude,LOC.longitude));
      kakaoSearch();}
  });
  document.head.appendChild(s);
}
function kakaoSearch(){
  if(!KREADY)return false;
  const ps=new kakao.maps.services.Places();
  const kw=(last?last[0]:'');
  const done=(data,st)=>{
    if(st!==kakao.maps.services.Status.OK){
      el('near').innerHTML='<div class="tip">주변에서 못 찾았다. '+
        '반경을 넓혀보라.</div>';return;}
    KMARK.forEach(m=>m.setMap(null));KMARK=[];
    const b=new kakao.maps.LatLngBounds(),rows=[];
    data.slice(0,30).forEach(d=>{
      const pos=new kakao.maps.LatLng(d.y,d.x);
      const mk=new kakao.maps.Marker({map:KMAP,position:pos});
      const iw=new kakao.maps.InfoWindow({content:
        '<div style="padding:6px 10px;font-size:12px">'+d.place_name+'</div>'});
      kakao.maps.event.addListener(mk,'click',()=>iw.open(KMAP,mk));
      KMARK.push(mk);b.extend(pos);
      rows.push('<a class="nr" target="_blank" href="'+d.place_url+'">'+
        '<span class="ne">📍</span><span class="nn">'+d.place_name+'</span>'+
        '<span class="nc">'+(d.category_name||'').split('>').pop().trim()+
        '</span><span class="nd">'+(d.distance?d.distance+' m':'')+'</span></a>');
    });
    KMAP.setBounds(b);
    el('nearinfo').textContent=rows.length+' 곳 · 카카오맵';
    el('near').innerHTML=rows.join('');
  };
  const opt={location:LOC?new kakao.maps.LatLng(LOC.latitude,LOC.longitude):null,
     radius:+el('rad').value,sort:kakao.maps.services.SortBy.DISTANCE};
  if(kw){
    // 뽑힌 메뉴로 먼저 찾고, 없으면 음식점 전체로
    ps.keywordSearch(kw,(d,s)=>{
      if(s===kakao.maps.services.Status.OK&&d.length)done(d,s);
      else ps.categorySearch('FD6',done,opt);
    },opt);
  }else{
    ps.categorySearch('FD6',done,opt);
  }
  return true;
}
function initMap(){
  if(USEK){if(!KMAP&&!KREADY)loadKakao();return;}
  if(LMAP||typeof L==='undefined')return;
  const c=LOC?[LOC.latitude,LOC.longitude]:[37.2939,126.9769];
  LMAP=L.map('lmap').setView(c,16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(LMAP);
  LAYER=L.layerGroup().addTo(LMAP);
  // 접혔다 펴지거나 폭이 바뀌면 타일이 비어 보인다 — 크기를 다시 잡는다
  const fix=()=>{try{LMAP.invalidateSize();}catch(e){}};
  setTimeout(fix,120);setTimeout(fix,500);setTimeout(fix,1200);
  window.addEventListener('resize',fix);
  if(window.ResizeObserver)new ResizeObserver(fix).observe(el('lmap'));
  if(LOC)L.circleMarker(c,{radius:8,color:'#c2410c',fillColor:'#c2410c',
    fillOpacity:.9}).addTo(LMAP).bindPopup('내 위치');
}
function locate(){
  if(!navigator.geolocation){el('nearinfo').textContent='위치 기능이 없다';
    initMap();return;}
  el('nearinfo').textContent='위치 확인 중…';
  navigator.geolocation.getCurrentPosition(p=>{
    LOC=p.coords;initMap();
    if(LMAP){LMAP.setView([LOC.latitude,LOC.longitude],16);
      L.circleMarker([LOC.latitude,LOC.longitude],{radius:8,color:'#c2410c',
        fillColor:'#c2410c',fillOpacity:.9}).addTo(LMAP).bindPopup('내 위치');}
    if(KMAP)KMAP.setCenter(new kakao.maps.LatLng(LOC.latitude,LOC.longitude));
    el('nearinfo').textContent='위치 확인됨';
    nearby();
  },()=>{el('nearinfo').textContent='위치를 못 잡았다 (자물쇠 → 위치 허용)';
    initMap();},{enableHighAccuracy:true,timeout:8000,maximumAge:300000});
}
function dist(a,b,c,d){
  const R=6371000,r=Math.PI/180;
  const x=(c-a)*r,y=(d-b)*r*Math.cos((a+c)/2*r);
  return Math.round(Math.sqrt(x*x+y*y)*R);
}
const CUIS={korean:'한식',japanese:'일식',chinese:'중식',italian:'양식',
 pizza:'피자',burger:'버거',chicken:'치킨',noodle:'면',sushi:'초밥',
 ramen:'라멘',thai:'아시안',vietnamese:'아시안',asian:'아시안',
 barbecue:'고기',seafood:'해물',cafe:'카페',bakery:'빵'};
let waitN=0;
function nearby(){
  if(!LOC){locate();return;}
  if(USEK&&!KFAIL){
    if(kakaoSearch()){waitN=0;return;}
    if(waitN<15){
      waitN++;
      el('near').innerHTML='<div class="tip">지도 준비 중…</div>';
      setTimeout(nearby,400);return;
    }
    KFAIL=true;
    el('nearinfo').textContent='카카오 실패 — OSM 으로 대체';
    initMap();
  }
  const r=+el('rad').value;
  el('near').innerHTML='<div class="tip">찾는 중…</div>';
  const q='[out:json][timeout:25];(node["amenity"~"restaurant|fast_food"]'+
    '(around:'+r+','+LOC.latitude+','+LOC.longitude+'););out body 60;';
  const SRV=['https://overpass-api.de/api/interpreter'];
  const tryFetch=i=>{
    const ac=new AbortController();
    const to=setTimeout(()=>ac.abort(),8000);
    return fetch(SRV[i]+'?data='+encodeURIComponent(q),{signal:ac.signal})
      .then(x=>{clearTimeout(to);if(!x.ok)throw 0;return x.json();})
      .catch(e=>{clearTimeout(to);
        if(i+1<SRV.length)return tryFetch(i+1);throw e;});
  };
  tryFetch(0)
   .then(j=>{
     const want=last?last[0]:'';
     const list=(j.elements||[]).filter(e=>e.tags&&e.tags.name).map(e=>({
       n:e.tags.name,
       c:CUIS[(e.tags.cuisine||'').split(';')[0]]||e.tags.cuisine||'',
       d:dist(LOC.latitude,LOC.longitude,e.lat,e.lon),
       lat:e.lat,lon:e.lon
     }));
     list.forEach(x=>{x.hit=!!(want&&(x.n.includes(want)||
       (last&&last[3]&&x.c===last[3])));});
     list.sort((a,b)=>(b.hit-a.hit)||(a.d-b.d));
     const top=list.slice(0,25);
     el('nearinfo').textContent=top.length+' 곳 · 반경 '+
       (r>=1000?(r/1000)+' km':r+' m');
     el('near').innerHTML=top.map(x=>
       '<a class="nr" target="_blank" href="https://map.kakao.com/?q='+
       encodeURIComponent(x.n)+'"><span class="ne">'+(x.hit?'⭐':'📍')+
       '</span><span class="nn">'+x.n+'</span>'+
       (x.c?'<span class="nc">'+x.c+'</span>':'')+
       '<span class="nd">'+x.d+' m</span></a>').join('')||
       '<div class="tip">이 반경에 등록된 식당이 없다. 반경을 넓혀보라.</div>';
     if(LMAP&&LAYER){
       LAYER.clearLayers();
       const pts=[];
       top.forEach(x=>{pts.push([x.lat,x.lon]);
         L.marker([x.lat,x.lon]).addTo(LAYER).bindPopup('<b>'+x.n+'</b>'+
           (x.c?'<br>'+x.c:'')+'<br>'+x.d+' m<br>'+
           '<a href="https://map.kakao.com/?q='+encodeURIComponent(x.n)+
           '" target="_blank">카카오맵에서 보기 ↗</a>');});
       if(LOC)pts.push([LOC.latitude,LOC.longitude]);
       try{LMAP.invalidateSize();}catch(e){}
       if(pts.length)LMAP.fitBounds(pts,{padding:[28,28]});
     }
   })
   .catch(()=>{el('near').innerHTML=
     '<div class="tip"><b>목록을 못 불러왔다.</b> OpenStreetMap 공개 서버가 '+
     '가끔 막힌다.<br>「주변 다시 찾기」 를 한 번 더 누르거나, '+
     '<b>바탕화면 「뭐먹지 (지도)」 로 열면</b> 카카오맵으로 안정적으로 뜬다.</div>';
     el('nearinfo').textContent='조회 실패';});
}
el('nearBtn').onclick=()=>{LOC?nearby():locate();};
el('mapK').onclick=()=>{
  const nm=last?last[0]:'맛집';
  window.open('https://map.kakao.com/?q='+encodeURIComponent(nm),'_blank');
};
setInterval(()=>{
  const d=new Date();
  el('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+
    String(d.getMinutes()).padStart(2,'0')+' · '+autoMeal()+' 시간';
},1000);
hist();pool();
initMap();
locate();
</script>
